// Базовые параметры движения
cl_forwardspeed 175
cl_backspeed 150
cl_sidespeed 160

// Агрессивный импульс без прыжка (горизонтальный прорыв)
alias dash_tick "cl_forwardspeed 1600; cl_sidespeed 1200; +forward"
alias +dash "dash_tick; +duck; wait; wait; wait; wait; wait"
alias -dash "-duck; -forward; cl_forwardspeed 175; cl_sidespeed 160"

bind "ALT" "+dash"